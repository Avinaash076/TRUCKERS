services:
  - type: web
    name: weatherhaul-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.lock.txt
    startCommand: cd backend && gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 240 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PROVIDER_USER_AGENT
        value: WeatherHaul-assessment/1.0
  - type: web
    name: weatherhaul
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
